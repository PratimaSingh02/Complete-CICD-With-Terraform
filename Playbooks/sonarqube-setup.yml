---
- name: Install and Run SonarQube via Docker cleanly
  hosts: all
  become: true
  tasks:
    - name: Install Docker Engine natively
      yum:
        name: docker
        state: present

    - name: Ensure Docker group exists
      group:
        name: docker
        state: present

    - name: Configure secure permissions on Docker socket file
      file:
        path: /var/run/docker.sock
        mode: '0660'
        owner: root
        group: docker

    - name: Add standard users to the Docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop:
        - ec2-user

    - name: Start and Enable Docker Service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Configure kernel parameters for SonarQube Elasticsearch
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: true

    - name: Deploy SonarQube Container via Native Docker Module
      community.docker.docker_container:
        name: sonarqube
        image: sonarqube:lts-community
        state: started
        restart_policy: always
        published_ports:
          - "9000:9000"
        volumes:
          - sonarqube_data:/opt/sonarqube/data
          - sonarqube_extensions:/opt/sonarqube/extensions
          - sonarqube_logs:/opt/sonarqube/logs
