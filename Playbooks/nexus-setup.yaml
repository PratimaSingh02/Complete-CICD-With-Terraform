---
- name: Install and Run Nexus via Docker cleanly
  hosts: all
  become: true
  tasks:
    - name: Install Docker Engine natively
      yum:
        name: docker
        state: present

    - name: Ensure Docker group exists
      group:
        name: docker
        state: present

    - name: Configure secure permissions on Docker socket file
      file:
        path: /var/run/docker.sock
        mode: '0660'
        owner: root
        group: docker

    - name: Add standard users to the Docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop:
        - ec2-user

    - name: Start and Enable Docker Service
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Deploy Nexus 3 Container via Native Docker Module
      community.docker.docker_container:
        name: nexus
        image: sonatype/nexus3
        state: started
        restart_policy: always
        published_ports:
          - "8081:8081"
        volumes:
          - nexus-data:/nexus-data
